<script>
/* ------------------------------------------------------------------
   On Time — native bridge

   Everything here degrades gracefully. Running in a plain browser,
   isNative() is false and the app keeps using the .ics export path.
   Inside Capacitor, real scheduled notifications take over.
   ------------------------------------------------------------------ */

window.OT = (function () {

  function cap() { return window.Capacitor; }
  function isNative() { return !!(cap() && cap().isNativePlatform && cap().isNativePlatform()); }
  function plugin(name) { return cap() && cap().Plugins ? cap().Plugins[name] : null; }
  function platform() { return isNative() ? cap().getPlatform() : 'web'; }

  /* ---------------- persistence ----------------
     Preferences is configured against the iOS App Group so the
     widget can read the same store. Note the plugin prefixes every
     key with "CapacitorStorage." — the widget code accounts for it. */
  var Prefs = {
    async get(key) {
      var p = plugin('Preferences');
      if (p) { var r = await p.get({ key: key }); return r.value; }
      if (window.storage) {
        try { var s = await window.storage.get(key); return s && s.value; } catch (e) { return null; }
      }
      // Plain browser or installed web app: this is the real store.
      try { return window.localStorage.getItem(key); } catch (e) { return null; }
    },
    async set(key, value) {
      var p = plugin('Preferences');
      if (p) return p.set({ key: key, value: value });
      if (window.storage) { try { return await window.storage.set(key, value); } catch (e) {} }
      try { window.localStorage.setItem(key, value); } catch (e) {}
    }
  };

  /* ---------------- notifications ---------------- */

  // iOS holds a hard ceiling of 64 pending local notifications per app.
  // We spread the budget across accounts rather than letting the first
  // few accounts consume every slot.
  var IOS_PENDING_CAP = 60;

  function notifId(accountId, monthOffset) {
    // Capacitor needs a 32-bit int. Hash the account id, then reserve
    // low bits for the month offset so ids stay stable and cancellable.
    var h = 0;
    for (var i = 0; i < accountId.length; i++) {
      h = ((h << 5) - h + accountId.charCodeAt(i)) | 0;
    }
    return Math.abs(h % 1000000) * 32 + (monthOffset % 32);
  }

  function dueDateFor(dueDay, monthOffset) {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var y = t.getFullYear(), m = t.getMonth() + monthOffset;
    var dim = new Date(y, m + 1, 0).getDate();
    return new Date(y, m, Math.min(dueDay, dim));
  }

  async function requestPermission() {
    var LN = plugin('LocalNotifications');
    if (!LN) return false;
    var r = await LN.requestPermissions();
    return r.display === 'granted';
  }

  async function permissionState() {
    var LN = plugin('LocalNotifications');
    if (!LN) return 'unsupported';
    var r = await LN.checkPermissions();
    return r.display;
  }

  /* Rebuilds the entire schedule from scratch. Called on any change to
     accounts, reminder settings, reminder hour, or paid status. Cheaper
     and far less bug-prone than trying to patch individual entries. */
  async function reschedule(accounts, remindHour, paidThisCycle) {
    var LN = plugin('LocalNotifications');
    if (!LN) return { scheduled: 0, native: false };

    var pending = await LN.getPending();
    if (pending.notifications.length) {
      await LN.cancel({ notifications: pending.notifications });
    }

    var active = accounts.filter(function (a) {
      return a.remind !== -1 && a.dueDay;
    });
    if (!active.length) return { scheduled: 0, native: true };

    var monthsEach = Math.max(1, Math.floor(IOS_PENDING_CAP / active.length));
    if (monthsEach > 12) monthsEach = 12;

    var now = new Date();
    var list = [];

    active.forEach(function (a) {
      var lead = a.remind === undefined ? 3 : a.remind;
      for (var k = 0; k < monthsEach; k++) {
        var due = dueDateFor(a.dueDay, k);
        var fire = new Date(due);
        fire.setDate(fire.getDate() - lead);
        fire.setHours(remindHour, 0, 0, 0);

        if (fire <= now) continue;
        // Already ticked off for this cycle? Skip only the imminent one.
        if (k === 0 && paidThisCycle.indexOf(a.id) > -1) continue;

        var amount = '$' + Math.round(a.payment || 0).toLocaleString('en-US');
        var when = lead === 0 ? 'due today'
                 : lead === 1 ? 'due tomorrow'
                 : 'due in ' + lead + ' days';

        list.push({
          id: notifId(a.id, k),
          title: a.autopay ? a.name + ' posts soon' : 'Pay ' + a.name,
          body: amount + ' ' + when +
                (a.autopay ? ' on autopay — check the balance is there.' : '.'),
          schedule: { at: fire, allowWhileIdle: true },
          sound: 'default',
          extra: { accountId: a.id, url: a.url || '' },
          actionTypeId: 'BILL_ACTIONS'
        });
      }
    });

    if (list.length) await LN.schedule({ notifications: list });
    return { scheduled: list.length, native: true, monthsEach: monthsEach };
  }

  /* Tapping "Paid" straight from the notification. */
  async function registerActions() {
    var LN = plugin('LocalNotifications');
    if (!LN || !LN.registerActionTypes) return;
    await LN.registerActionTypes({
      types: [{
        id: 'BILL_ACTIONS',
        actions: [
          { id: 'MARK_PAID', title: 'Mark paid' },
          { id: 'SNOOZE', title: 'Remind me tomorrow' }
        ]
      }]
    });
  }

  function onAction(handler) {
    var LN = plugin('LocalNotifications');
    if (!LN) return;
    LN.addListener('localNotificationActionPerformed', function (e) {
      handler(e.actionId, e.notification.extra || {});
    });
  }

  /* ---------------- widget feed ----------------
     The widget can't run JavaScript, so the app writes a small
     summary the widget reads directly out of the App Group. */
  async function pushWidgetData(accounts, paidThisCycle) {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var upcoming = accounts.map(function (a) {
      var paid = paidThisCycle.indexOf(a.id) > -1;
      var d = dueDateFor(a.dueDay, 0);
      if (d < t || paid) d = dueDateFor(a.dueDay, 1);
      return { name: a.name, amount: a.payment || 0, date: d, paid: paid, type: a.type };
    }).sort(function (p, q) { return p.date - q.date; });

    var next = upcoming[0];
    var thisMonth = upcoming.filter(function (u) {
      return (u.date - t) / 86400000 <= 31 && !u.paid;
    });

    var payload = {
      nextName: next ? next.name : '',
      nextAmount: next ? next.amount : 0,
      nextType: next ? next.type : 'other',
      nextDays: next ? Math.round((next.date - t) / 86400000) : -1,
      remaining: thisMonth.reduce(function (s, u) { return s + u.amount; }, 0),
      count: thisMonth.length,
      updated: Date.now()
    };

    await Prefs.set('widget', JSON.stringify(payload));

    var w = plugin('WidgetsBridge');
    if (w && w.reloadAllTimelines) { try { await w.reloadAllTimelines(); } catch (e) {} }
    return payload;
  }

  /* ---------------- biometric lock ---------------- */
  async function lockAvailable() {
    var b = plugin('NativeBiometric');
    if (!b) return false;
    try { var r = await b.isAvailable(); return !!r.isAvailable; } catch (e) { return false; }
  }
  async function unlock() {
    var b = plugin('NativeBiometric');
    if (!b) return true;
    try {
      await b.verifyIdentity({
        reason: 'Open your payment ledger',
        title: 'On Time',
        subtitle: '',
        description: ''
      });
      return true;
    } catch (e) { return false; }
  }

  /* ---------------- polish ---------------- */
  async function tap(style) {
    var h = plugin('Haptics');
    if (h) { try { await h.impact({ style: style || 'Light' }); } catch (e) {} }
  }
  async function styleStatusBar() {
    var s = plugin('StatusBar');
    if (s) {
      try {
        await s.setStyle({ style: 'LIGHT' });
        if (platform() === 'android') await s.setBackgroundColor({ color: '#6B4E71' });
      } catch (e) {}
    }
  }
  async function share(text, title) {
    var s = plugin('Share');
    if (s) { try { await s.share({ title: title, text: text, dialogTitle: title }); return true; } catch (e) {} }
    return false;
  }

  return {
    isNative: isNative, platform: platform,
    Prefs: Prefs,
    requestPermission: requestPermission, permissionState: permissionState,
    reschedule: reschedule, registerActions: registerActions, onAction: onAction,
    pushWidgetData: pushWidgetData,
    lockAvailable: lockAvailable, unlock: unlock,
    tap: tap, styleStatusBar: styleStatusBar, share: share
  };
})();

</script>

  .fab-wrap { padding: 22px 20px 0; }
  .fab { width: 100%; background: var(--plum); color: #fff; border-radius: 16px; padding: 15px; font-size: 15.5px; font-weight: 620; }

    .tick:active, .pay:active, .chipbtn:active { transform: scale(.94); }

</style>

<script>
(function () {
  var root = document.getElementById('root');
  var KEY = 'ontime:v2';
  var state = {
    accounts: [], paid: {}, extra: 0, strategy: 'avalanche',
    offer: null, remindHour: 9, notify: false
  };
  var editing = null, flash = null, icsText = null;
  var dataPanel = null, pendingImport = null, dataText = null;

  /* ---------- storage ---------- */
  function save() {
    try { OT.Prefs.set(KEY, JSON.stringify(state)); } catch (e) {}
    syncNative();
  }
  async function load() {
    try {
      var v = await OT.Prefs.get(KEY);
      if (v) state = Object.assign(state, JSON.parse(v));
    } catch (e) {}
  }

  /* Any change to accounts, reminders or paid status rebuilds the
     native schedule and refreshes the widget. Debounced so a burst of
     edits does not thrash the notification centre. */
  var syncTimer = null;
  function syncNative() {
    if (!OT.isNative()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async function () {
      var paid = state.paid[ckey(today())] || [];
      try {
        await OT.pushWidgetData(state.accounts, paid);
        if (state.notify) await OT.reschedule(state.accounts, state.remindHour, paid);
      } catch (e) {}
    }, 400);
  }

  /* ---------- basics ---------- */
  var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
  function money2(n) { return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function today() { var d = new Date(); d.setHours(0,0,0,0); return d; }
  function ckey(d) { return d.getFullYear() + '-' + (d.getMonth()+1); }
  function ord(n) { var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
  function esc(s) { return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function pad(n) { return n < 10 ? '0'+n : ''+n; }

  function nextDue(day, skip) {
    var t = today(), y = t.getFullYear(), m = t.getMonth();
    function b(o) { var dim = new Date(y,m+o+1,0).getDate(); return new Date(y,m+o,Math.min(day,dim)); }
    var d = b(0);
    if (d < t || skip) d = b(1);
    return d;
  }
  function daysOut(d) { return Math.round((d - today())/86400000); }

  var TYPES = {
    card:     { label:'Credit card',   amortize:true,  c:'#6B4E71', s:'#F0E8F1',
                p:'<rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/><path d="M6 14.5h3.5"/>' },
    auto:     { label:'Auto loan',     amortize:true,  c:'#9A6B2F', s:'#F7EDDF',
                p:'<path d="M3 16.5v-3l2-5.5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5.5v3"/><path d="M4 13.5h16"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>' },
    mortgage: { label:'Mortgage',      amortize:true,  c:'#2F6B72', s:'#E2EFF0',
                p:'<path d="M3 11 12 3.5 21 11v9.5H3z"/><path d="M9.5 20.5v-6h5v6"/>' },
    student:  { label:'Student loan',  amortize:true,  c:'#3D7D5B', s:'#E4F0E9',
                p:'<path d="M12 3.5 22 8.5 12 13.5 2 8.5z"/><path d="M6 10.8V16c0 1.6 12 1.6 12 0v-5.2"/>' },
    personal: { label:'Personal loan', amortize:true,  c:'#8A4A63', s:'#F5E6EC',
                p:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M5.5 12h.5M18 12h.5"/>' },
    utility:  { label:'Utility',       amortize:false, c:'#B07C22', s:'#FAF0DC',
                p:'<path d="M13.5 2.5 5.5 13.5h5l-1.5 8 9-11.5h-5.2z"/>' },
    other:    { label:'Other bill',    amortize:false, c:'#6B6472', s:'#EEEBF0',
                p:'<path d="M5 3.5h14v17l-2.3-1.6-2.3 1.6-2.4-1.6-2.3 1.6-2.4-1.6L5 20.5z"/><path d="M8.5 8.5h7M8.5 12.5h7"/>' }
  };
  function icon(type, cls) {
    var t = TYPES[type] || TYPES.other;
    return '<svg class="ic ' + (cls||'') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + t.p + '</svg>';
  }
  // Engraved rosette, the way security paper is guilloched.
  function rosette() {
    var e = '';
    for (var i = 0; i < 30; i++) {
      e += '<ellipse cx="150" cy="150" rx="128" ry="52" transform="rotate(' + (i*12) + ' 150 150)"/>';
    }
    return '<svg class="engrave" viewBox="0 0 300 300" fill="none" stroke="#fff" ' +
      'stroke-width="0.55" stroke-opacity="0.30" aria-hidden="true">' + e +
      '<circle cx="150" cy="150" r="132" stroke-opacity="0.22"/>' +
      '<circle cx="150" cy="150" r="96" stroke-opacity="0.18"/></svg>';
  }
  var LEADS = [0,1,2,3,5,7,10,14];
  function leadLabel(n) {
    return n === 0 ? 'On the due date' : n === 1 ? '1 day before' : n + ' days before';
  }

  /* ---------- calendar file ---------- */
  function buildICS(list) {
    var now = new Date();
    var stamp = now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+
                pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';
    var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//On Time//Bill Reminders//EN',
             'CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Bill payments'];

    list.forEach(function (a) {
      var d = nextDue(a.dueDay);
      var lead = a.remind === undefined ? 3 : a.remind;
      var dt = d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(state.remindHour)+'0000';
      var title = 'Pay ' + a.name + ' — ' + money(a.payment || 0);
      var desc = [
        'Amount: ' + money2(a.payment || 0),
        TYPES[a.type].amortize && a.balance ? 'Balance: ' + money(a.balance) : '',
        a.autopay ? 'On autopay — this is a confirmation check, not an action.' : 'Not on autopay.',
        a.url ? 'Pay: ' + a.url : ''
      ].filter(Boolean).join('\\n');

      L.push('BEGIN:VEVENT');
      L.push('UID:' + a.id + '@ontime.local');
      L.push('DTSTAMP:' + stamp);
      L.push('DTSTART:' + dt);
      L.push('DURATION:PT30M');
      L.push('RRULE:FREQ=MONTHLY;BYMONTHDAY=' + a.dueDay);
      L.push('SUMMARY:' + title);
      L.push('DESCRIPTION:' + desc);
      if (a.url) L.push('URL:' + a.url);
      L.push('BEGIN:VALARM');
      L.push('TRIGGER:-P' + (lead === 0 ? '0D' : lead + 'D'));
      L.push('ACTION:DISPLAY');
      L.push('DESCRIPTION:' + title);
      L.push('END:VALARM');
      if (lead > 0) {
        L.push('BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY',
               'DESCRIPTION:Due today — ' + title,'END:VALARM');
      }
      L.push('END:VEVENT');
    });

    L.push('END:VCALENDAR');
    return L.join('\r\n');
  }

  function downloadICS() {
    var list = state.accounts.filter(function (a) { return a.remind !== -1; });
    if (!list.length) { flash = { t:'warn', m:'Every account has reminders switched off.' }; render(); return; }
    var text = buildICS(list);
    try {
      var blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'bill-reminders.ics';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      flash = { t:'ok', m: list.length + ' reminders exported. Open the file and your calendar will offer to add them.' };
      icsText = null;
    } catch (e) {
      icsText = text;
      flash = { t:'warn', m:'Download was blocked here. Copy the text below into a file named bill-reminders.ics, then open it.' };
    }
    render();
  }

  /* ---------- in-app nudge ---------- */
  async function askNotify() {
    if (OT.isNative()) {
      var ok = await OT.requestPermission();
      state.notify = ok;
      if (ok) {
        await OT.registerActions();
        var paid = state.paid[ckey(today())] || [];
        var r = await OT.reschedule(state.accounts, state.remindHour, paid);
        flash = { t:'ok', m: r.scheduled + ' reminders scheduled, covering the next ' +
          r.monthsEach + ' month' + (r.monthsEach===1?'':'s') + '. They fire whether or not the app is open.' };
      } else {
        flash = { t:'warn', m:'Notifications are switched off. Turn them on in Settings, or use the calendar export below.' };
      }
      save(); render();
      return;
    }
    try {
      if (typeof Notification === 'undefined') {
        flash = { t:'warn', m:'This browser does not support notifications. Use the calendar file instead.' };
        render(); return;
      }
      var p = await Notification.requestPermission();
      state.notify = (p === 'granted');
      flash = state.notify
        ? { t:'ok', m:'Nudges on. In the browser these only fire while the app is open — the calendar file is what covers you otherwise.' }
        : { t:'warn', m:'Notifications were declined. The calendar file still works.' };
      save(); render();
      if (state.notify) checkNudges();
    } catch (e) {}
  }
  function checkNudges() {
    if (OT.isNative()) return;           // native scheduling handles this
    if (!state.notify || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    var paid = state.paid[ckey(today())] || [];
    state.accounts.forEach(function (a) {
      if (paid.indexOf(a.id) > -1) return;
      var lead = a.remind === undefined ? 3 : a.remind;
      if (lead === -1) return;
      var out = daysOut(nextDue(a.dueDay));
      if (out <= lead) {
        var tag = 'nudge-' + a.id + '-' + ckey(today());
        if (sessionSeen[tag]) return;
        sessionSeen[tag] = 1;
        try {
          new Notification('Pay ' + a.name, {
            body: money(a.payment||0) + ' due ' + (out === 0 ? 'today' : 'in ' + out + ' days'),
            tag: tag
          });
        } catch (e) {}
      }
    });
  }
  var sessionSeen = {};

  /* Acting on a notification without opening the app fully. */
  function bindNotificationActions() {
    if (!OT.isNative()) return;
    OT.onAction(function (actionId, extra) {
      if (!extra.accountId) return;
      if (actionId === 'MARK_PAID') {
        var ck = ckey(today()), arr = state.paid[ck] || [];
        if (arr.indexOf(extra.accountId) === -1) state.paid[ck] = arr.concat([extra.accountId]);
        save(); render();
      }
    });
  }

  /* ---------- projection ---------- */
  function project(strategy, extra) {
    strategy = strategy || state.strategy;
    extra = (extra === undefined || extra === null) ? state.extra : extra;
    var debts = state.accounts.filter(function (a) {
      return TYPES[a.type].amortize && a.balance > 0;
    }).map(function (a) {
      return { id:a.id, name:a.name, bal:a.balance, apr:(a.apr||0)/100, min:a.payment||0, interest:0, months:null };
    });
    if (!debts.length) return { series:[], debts:[], months:0, interest:0, stalled:[] };

    var stalled = debts.filter(function(d){ return d.bal*d.apr/12 >= d.min; }).map(function(d){ return d.name; });
    var series = [{ m:0, total: debts.reduce(function(s,d){return s+d.bal;},0) }];
    var freed = 0, ti = 0, m = 0;

    while (debts.some(function(d){return d.bal>0.01;}) && m < 600) {
      m++;
      var live = debts.filter(function(d){return d.bal>0.01;});
      var target = live.slice().sort(function(a,b){
        return strategy === 'avalanche' ? b.apr-a.apr : a.bal-b.bal;
      })[0];
      var pool = extra + freed;
      live.forEach(function (d) {
        var int = d.bal*d.apr/12;
        d.interest += int; ti += int; d.bal += int;
        var pay = Math.min(d.min + (d===target?pool:0), d.bal);
        d.bal -= pay;
        if (d.bal <= 0.01) { d.bal = 0; d.months = m; freed += d.min; }
      });
      series.push({ m:m, total: debts.reduce(function(s,d){return s+d.bal;},0) });
    }
    return { series:series, debts:debts, months: m>=600?null:m, interest:ti, stalled:stalled };
  }

  function payoffOne(bal, aprPct, pay, introM, introApr) {
    var r = aprPct/100/12, ir = (introApr||0)/100/12, interest = 0, m = 0;
    while (bal > 0.01 && m < 600) {
      m++;
      var rate = (introM && m <= introM) ? ir : r;
      var int = bal*rate; interest += int; bal += int;
      var p = Math.min(pay, bal); bal -= p;
      if (p <= int + 0.001 && bal > 0.01) return { months:null, interest:Infinity };
    }
    return { months: m>=600?null:m, interest:interest };
  }
  function levelPayment(bal, aprPct, n) {
    var r = aprPct/100/12;
    return r === 0 ? bal/n : bal*r/(1-Math.pow(1+r,-n));
  }

  /* ---------- savings ideas ---------- */
  function opportunities() {
    var out = [];
    var debts = state.accounts.filter(function(a){ return TYPES[a.type].amortize && a.balance>0 && a.payment>0; });
    if (!debts.length) return out;
    var base = project();

    var av = project('avalanche'), sn = project('snowball');
    var gap = sn.interest - av.interest;
    if (gap > 40 && debts.length > 1) {
      out.push({
        save: state.strategy === 'snowball' ? gap : 0,
        title: state.strategy === 'snowball' ? 'Change the order you attack them in' : 'Your payment order is already the cheap one',
        body: state.strategy === 'snowball'
          ? 'Going after your highest rate instead of your smallest balance saves ' + money(gap) + '. You trade away the satisfaction of clearing small accounts early.'
          : 'Highest-rate-first saves ' + money(gap) + ' over smallest-balance-first. Nothing to change here.',
        act: state.strategy === 'snowball' ? 'Free. One tap on the toggle above.' : null
      });
    }

    if (base.months) {
      var plus = project(null, state.extra + 100);
      if (plus.months) out.push({
        save: base.interest - plus.interest,
        title: 'What the next $100 a month buys',
        body: 'One more hundred dollars saves ' + money(base.interest-plus.interest) +
              ' in interest and brings your finish line forward by ' + (base.months-plus.months) + ' months.',
        act: 'Test other amounts in the field above.'
      });
    }

    debts.filter(function(a){ return a.type==='card' && a.apr>=12 && a.balance>=400; }).forEach(function (a) {
      var now = payoffOne(a.balance,a.apr,a.payment), aft = payoffOne(a.balance,a.apr,a.payment,18,0);
      var fee = a.balance*0.03, net = now.interest-aft.interest-fee;
      if (net > 50) out.push({
        save: net,
        title: 'Move ' + a.name + ' onto a 0% transfer',
        body: 'At ' + a.apr + '% this balance costs ' + money(now.interest) + ' to clear. An 18-month 0% offer with a 3% fee (' +
              money(fee) + ') leaves you ' + money(net) + ' ahead. Paying ' + money2(a.balance/18) + ' a month finishes it inside the intro window.',
        act: 'Needs a new card and a hard credit check. What matters is the rate after the intro ends, if you do not finish in time.'
      });
    });

    var floors = { auto:6.5, mortgage:6, personal:9, student:5.5 };
    debts.filter(function(a){ return floors[a.type] && a.apr > floors[a.type]+1; }).forEach(function (a) {
      var now = payoffOne(a.balance,a.apr,a.payment);
      if (!now.months) return;
      var t = floors[a.type], np = levelPayment(a.balance,t,now.months), ni = np*now.months-a.balance;
      var cost = a.type==='mortgage' ? a.balance*0.02 : 0, net = now.interest-ni-cost;
      if (net > 200) out.push({
        save: net,
        title: 'Look at refinancing ' + a.name,
        body: 'You are at ' + a.apr + '% with ' + now.months + ' months to go. At ' + t + '% over the same term your payment drops to ' +
              money2(np) + ' and you keep ' + money(now.interest-ni) + (cost ? ', less about ' + money(cost) + ' in closing costs' : '') + '.',
        act: 'That rate is an illustration, not a quote. Get real offers, then test one below.'
      });
    });

    var top = debts.slice().sort(function(a,b){return b.apr-a.apr;})[0];
    if (top && top.apr >= 8) out.push({
      save: 0,
      title: 'Spare cash is losing to ' + top.name,
      body: 'Clearing a ' + top.apr + '% balance is a guaranteed ' + top.apr + '% return, which no savings account is going to match. Money beyond your emergency fund works harder here.',
      act: 'Keep three to six months of expenses liquid first. This is only about what sits above that.'
    });

    return out.sort(function(a,b){ return b.save-a.save; });
  }

  function offerResult() {
    var o = state.offer;
    if (!o || !o.id) return null;
    var a = state.accounts.filter(function(x){return x.id===o.id;})[0];
    if (!a || !a.balance || !a.payment) return null;
    var rate = parseFloat(o.rate); if (isNaN(rate)) return null;
    var fee = (parseFloat(o.fee)||0)/100*a.balance, intro = parseInt(o.months,10)||0;
    var now = payoffOne(a.balance,a.apr,a.payment);
    var aft = intro ? payoffOne(a.balance,a.apr,a.payment,intro,rate) : payoffOne(a.balance,rate,a.payment);
    if (now.interest === Infinity) return null;
    return { name:a.name, fee:fee, nowInt:now.interest,
             newInt: aft.interest===Infinity?null:aft.interest,
             net: aft.interest===Infinity?null:now.interest-aft.interest-fee };
  }

  /* ---------- chart ---------- */
  function chart(series) {
    if (series.length < 2) return '';
    var W=640,H=190,PL=6,PR=6,PT=14,PB=24;
    var maxY = series[0].total||1, n = series.length-1;
    var x=function(i){return PL+(i/n)*(W-PL-PR);}, y=function(v){return PT+(1-v/maxY)*(H-PT-PB);};
    var pts = series.map(function(p,i){return x(i)+','+y(p.total);}).join(' L ');
    var grid='';
    for (var i=12;i<=n;i+=12) {
      grid += '<line x1="'+x(i)+'" y1="'+PT+'" x2="'+x(i)+'" y2="'+(H-PB)+'" stroke="#E6E0E8" stroke-width="1"/>'+
              '<text x="'+x(i)+'" y="'+(H-7)+'" fill="#A9A0AE" font-size="11" text-anchor="middle">'+(i/12)+'y</text>';
    }
    return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Projected balance over time">'+
      '<defs><linearGradient id="og" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#6B4E71" stop-opacity="0.20"/>'+
      '<stop offset="100%" stop-color="#6B4E71" stop-opacity="0.02"/></linearGradient>'+
      '<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
      '<line x1="0" y1="0" x2="0" y2="7" stroke="#6B4E71" stroke-opacity="0.16" stroke-width="1.2"/></pattern></defs>'+
      grid+
      '<path d="M '+x(0)+','+y(0)+' L '+pts+' L '+x(n)+','+y(0)+' Z" fill="url(#og)"/>'+
      '<path d="M '+x(0)+','+y(0)+' L '+pts+' L '+x(n)+','+y(0)+' Z" fill="url(#hatch)"/>'+
      '<path d="M '+pts+'" fill="none" stroke="#6B4E71" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+x(n)+'" cy="'+y(0)+'" r="5.5" fill="#fff" stroke="#3D7D5B" stroke-width="2.5"/>'+
      '<text x="'+PL+'" y="'+(y(maxY)-2)+'" fill="#857A8B" font-size="11">'+money(maxY)+'</text></svg>';
  }


  /* ---------- backup and restore ---------- */
  function exportPayload() {
    return JSON.stringify({
      app: 'On Time', version: 1, exportedAt: new Date().toISOString(),
      accounts: state.accounts, paid: state.paid,
      extra: state.extra, strategy: state.strategy, remindHour: state.remindHour
    }, null, 2);
  }

  function doExport() {
    var text = exportPayload();
    var stamp = new Date().toISOString().slice(0, 10);
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'on-time-backup-' + stamp + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      dataText = null;
      flash = { t: 'ok', m: 'Backup saved. Keep a copy somewhere other than this device.' };
    } catch (e) {
      dataText = text;
      flash = { t: 'warn', m: 'Download was blocked here. Copy everything below into a file and keep it safe.' };
    }
    render();
  }

  /* Never trust a pasted file. Rebuild every record field by field. */
  function parseImport(text) {
    var raw;
    try { raw = JSON.parse(text); }
    catch (e) { return { error: 'That is not valid backup data. Paste the whole file, braces included.' }; }
    if (!raw || typeof raw !== 'object') return { error: 'That file is not in the right shape.' };
    if (!Array.isArray(raw.accounts)) return { error: 'No accounts found in that file.' };

    var clean = [], skipped = 0;
    raw.accounts.forEach(function (a, i) {
      if (!a || typeof a !== 'object' || !a.name) { skipped++; return; }
      var day = parseInt(a.dueDay, 10);
      if (!(day >= 1 && day <= 31)) day = 1;
      var url = typeof a.url === 'string' ? a.url : '';
      if (url && !/^https?:/i.test(url)) url = '';
      var lead = parseInt(a.remind, 10);
      if (isNaN(lead) || lead < -1 || lead > 14) lead = 3;
      clean.push({
        id: String(a.id || ('a' + Date.now() + i)),
        name: String(a.name).slice(0, 60),
        type: TYPES[a.type] ? a.type : 'other',
        balance: Math.max(0, parseFloat(a.balance) || 0),
        apr: Math.max(0, parseFloat(a.apr) || 0),
        payment: Math.max(0, parseFloat(a.payment) || 0),
        limit: Math.max(0, parseFloat(a.limit) || 0),
        dueDay: day, remind: lead, url: url, autopay: !!a.autopay
      });
    });
    if (!clean.length) return { error: 'No usable accounts in that file.' };

    var hour = parseInt(raw.remindHour, 10);
    return {
      accounts: clean, skipped: skipped,
      paid: (raw.paid && typeof raw.paid === 'object') ? raw.paid : {},
      extra: Math.max(0, parseFloat(raw.extra) || 0),
      strategy: raw.strategy === 'snowball' ? 'snowball' : 'avalanche',
      remindHour: (hour >= 0 && hour <= 23) ? hour : 9,
      when: typeof raw.exportedAt === 'string' ? raw.exportedAt.slice(0, 10) : null
    };
  }

  function applyImport() {
    var p = pendingImport;
    if (!p || p.error) return;
    state.accounts = p.accounts;
    state.paid = p.paid;
    state.extra = p.extra;
    state.strategy = p.strategy;
    state.remindHour = p.remindHour;
    pendingImport = null; dataPanel = null; dataText = null;
    flash = { t: 'ok', m: p.accounts.length + ' accounts restored.' };
    save(); render();
  }

  function dataSection() {
    var has = state.accounts.length > 0;
    var h = '<div class="sec"><div class="sec-head"><h2>Backup</h2></div><div class="card">' +
      '<p class="data-lede">' + (has
        ? 'Your accounts live only on this device. Save a copy before you clear your browser, switch phones, or move to the installed app.'
        : 'Restoring from a backup? Bring your accounts across here.') + '</p>';

    h += '<div class="data-btns">' +
      (has ? '<button class="primary" data-act="export">Save a backup</button>' : '') +
      '<button data-act="import-open">Restore from backup</button></div>';

    if (dataText) h += '<textarea class="data-box" readonly>' + esc(dataText) + '</textarea>';

    if (dataPanel === 'import') {
      h += '<div class="file-row"><input type="file" id="imp-file" accept="application/json,.json"></div>' +
        '<textarea class="data-box" id="imp-text" placeholder="...or paste the contents of your backup file here"></textarea>';

      if (pendingImport) {
        if (pendingImport.error) {
          h += '<div class="preview bad">' + esc(pendingImport.error) + '</div>';
        } else {
          h += '<div class="preview"><b>' + pendingImport.accounts.length + ' accounts found' +
            (pendingImport.when ? ', saved ' + pendingImport.when : '') + '</b>' +
            esc(pendingImport.accounts.slice(0, 4).map(function (a) { return a.name; }).join(', ')) +
            (pendingImport.accounts.length > 4 ? ' and ' + (pendingImport.accounts.length - 4) + ' more' : '') +
            (pendingImport.skipped ? '. ' + pendingImport.skipped + ' unreadable entries skipped' : '') +
            '. This replaces everything currently in the app.</div>';
        }
      }
      h += '<div class="data-btns">' +
        '<button data-act="import-cancel">Cancel</button>' +
        (pendingImport && !pendingImport.error
          ? '<button class="primary" data-act="import-apply">Replace my data</button>' : '') +
        '</div>';
    }
    return h + '</div></div>';
  }

  /* ---------- disclaimers ---------- */

      '<details><summary>Reminders are a backup, not a guarantee</summary><p>' +

      'iOS limits how many can be pending at once. Nothing here confirms that a payment was actually ' +

      '<details><summary>Projections are estimates, not promises</summary><p>' +

      '<details><summary>Nothing here is financial advice</summary><p>' +

      '</div>';
  }

  /* ---------- render ---------- */
  function render() {
    var a = state.accounts, ck = ckey(today()), paid = state.paid[ck]||[];
    var monthly = a.reduce(function(s,x){return s+(x.payment||0);},0);
    var owed = a.reduce(function(s,x){return s+(x.balance||0);},0);
    var h = new Date().getHours();
    var greet = h<12 ? 'Good morning' : h<18 ? 'Good afternoon' : 'Good evening';
    var html = '';

    html += '<div class="crest">' + rosette() + '<div class="crest-in"><h1>' + greet + '</h1>';

    if (!a.length) {
      html += '<p class="line">Let\'s get your bills somewhere you can see them.</p>' +
        '</div><div class="rule"></div></div>' +
        '<div class="sec"><div class="card"><div class="blank">' +
        'Add your mortgage, car loan, cards and utilities. You will get a running month, reminders you can push to your calendar, and an honest payoff date.' +
        '</div></div></div><div class="fab-wrap"><button class="fab" data-act="add">Add your first account</button></div>' + dataSection() + legal();
      if (editing !== null) html += sheet();   // the form must render here too
      root.innerHTML = html; wire(); return;
    }

    var up = a.map(function(x){
      var p = paid.indexOf(x.id)>-1;
      return { a:x, date:nextDue(x.dueDay,p), paid:p };
    }).sort(function(p,q){return p.date-q.date;});
    var soon = up.filter(function(u){return daysOut(u.date)<=31;});
    var left = soon.reduce(function(s,u){return s+(u.paid?0:u.a.payment||0);},0);
    var nextUp = up.filter(function(u){return !u.paid;})[0];

    html += '<p class="line">' + (nextUp
      ? esc(nextUp.a.name) + ' is next, ' + (daysOut(nextUp.date)===0 ? 'due today' :
        daysOut(nextUp.date)===1 ? 'due tomorrow' : 'in ' + daysOut(nextUp.date) + ' days') + '.'
      : 'Everything in this cycle is handled.') + '</p>';

    var overdue = soon.filter(function(u){ return !u.paid && daysOut(u.date) <= 2; }).length;
    html += '<div class="stamp">' + (overdue
      ? icon('utility') + overdue + ' need' + (overdue===1?'s':'') + ' attention now'
      : icon('other') + 'Nothing overdue') + '</div>';

    html += '<div class="glance">' +
      '<div class="g-card lead"><div class="v num">' + money(left) + '</div><div class="k">Left this month</div></div>' +
      '<div class="g-card"><div class="v num">' + money(monthly) + '</div><div class="k">Monthly total</div></div>' +
      '<div class="g-card"><div class="v num">' + money(owed) + '</div><div class="k">Total owed</div></div>' +
      '</div></div><div class="rule"></div></div>';

    /* due list */
    html += '<div class="sec"><div class="sec-head"><h2>Coming up</h2><span class="note">' +
      soon.filter(function(u){return !u.paid;}).length + ' to go</span></div><div class="card">';
    if (!soon.length) {
      html += '<div class="blank">Nothing due in the next month.</div>';
    } else {
      soon.forEach(function (u) {
        var d = daysOut(u.date), T = TYPES[u.a.type];
        var urgent = !u.paid && d <= 2, warm = !u.paid && d <= 7;
        var when = u.paid ? 'Paid' : d===0 ? 'Due today' : d===1 ? 'Due tomorrow' : 'In ' + d + ' days';
        var lead = u.a.remind === undefined ? 3 : u.a.remind;
        var bg = u.paid ? 'var(--green-soft)' : urgent ? 'var(--rust-soft)' : T.s;
        var fg = u.paid ? 'var(--green)' : urgent ? 'var(--rust)' : T.c;
        html += '<div class="due' + (u.paid ? ' settled' : '') + '">' +
          '<div class="ic-wrap" style="background:' + bg + ';color:' + fg + '">' + icon(u.a.type) +
          '<span class="day num" style="color:' + fg + '">' + u.date.getDate() + '</span></div>' +
          '<div class="due-mid"><div class="due-name">' + esc(u.a.name) +
          (u.paid ? '<span class="paidmark">PAID</span>' : '') + '</div>' +
          '<div class="due-when' + (urgent ? ' urgent' : '') + '">' + when +
          (u.a.autopay ? ' · autopay' : lead === -1 ? '' : ' · reminder ' + (lead===0?'that day':lead+'d early')) + '</div></div>' +
          '<div class="due-right"><div class="due-amt num">' + money(u.a.payment||0) + '</div><div class="due-btns">' +
          (u.a.url ? '<button class="pay" data-act="open" data-id="' + u.a.id + '">Pay</button>' : '') +
          '<button class="tick ' + (u.paid?'on':'') + '" data-act="paid" data-id="' + u.a.id + '" aria-label="Mark paid">✓</button>' +
          '</div></div></div>';
      });
      html += '<div class="strip"><span>Still to pay</span><b class="num">' + money(left) + '</b></div>';
    }
    html += '</div></div>';

    /* reminders */
    html += '<div class="sec"><div class="sec-head"><h2>Reminders</h2></div><div class="card">' +
      '<p class="rem-lede">' + (OT.isNative()
        ? 'Reminders fire on your phone at the lead time you pick, whether or not the app is open. Change anything here and the schedule rebuilds itself.'
        : 'Push every bill into your phone\'s calendar as a repeating event with an alarm. Set once, and it fires whether or not this app is open.') + '</p>' +
      '<div class="rem-row"><label>Remind me at<div class="sub">Time of day the alarm goes off</div></label>' +
      '<select class="inline" id="r-hour">' +
      [6,7,8,9,10,12,17,18,19,20].map(function(x){
        return '<option value="'+x+'"'+(state.remindHour===x?' selected':'')+'>'+
          (x%12===0?12:x%12)+':00 '+(x<12?'am':'pm')+'</option>';
      }).join('') + '</select></div>';

    a.forEach(function (x) {
      var lead = x.remind === undefined ? 3 : x.remind;
      html += '<div class="rem-row"><label>' + esc(x.name) +
        '<div class="sub num">' + money(x.payment||0) + ' on the ' + ord(x.dueDay) + '</div></label>' +
        '<select class="inline lead" data-id="' + x.id + '">' +
        '<option value="-1"' + (lead===-1?' selected':'') + '>Off</option>' +
        LEADS.map(function(n){ return '<option value="'+n+'"'+(lead===n?' selected':'')+'>'+leadLabel(n)+'</option>'; }).join('') +
        '</select></div>';
    });

    if (flash) html += '<div class="toast ' + (flash.t==='warn'?'warn':'') + '">' + flash.m + '</div>';
    if (icsText) html += '<textarea class="ics-out" readonly>' + esc(icsText) + '</textarea>';

    if (OT.isNative()) {
      html += '<button class="big-btn" data-act="notify">' +
        (state.notify ? 'Reminders are on — rebuild schedule' : 'Turn on reminders') + '</button>' +
        '<button class="ghost-btn" data-act="ics">Also export to my calendar</button>';
    } else {
      html += '<button class="big-btn" data-act="ics">Add all reminders to my calendar</button>' +
        '<button class="ghost-btn" data-act="notify">' +
        (state.notify ? 'In-app nudges are on' : 'Also nudge me while the app is open') + '</button>';
    }
    html += '</div></div>';

    /* accounts */
    html += '<div class="sec"><div class="sec-head"><h2>Accounts</h2><span class="note">' + a.length + '</span></div><div class="card">';
    a.slice().sort(function(p,q){return (q.balance||0)-(p.balance||0);}).forEach(function (x) {
      var t = TYPES[x.type], pct = x.limit ? Math.min(100,(x.balance/x.limit)*100) : 0;
      html += '<div class="acct"><div class="acct-top">' +
        '<span class="acct-ic" style="background:' + t.s + ';color:' + t.c + '">' + icon(x.type) + '</span>' +
        '<span class="acct-name">' + esc(x.name) + '</span>' +
        '<span class="acct-bal num">' + (t.amortize ? money(x.balance||0) : money(x.payment||0)+'/mo') + '</span></div>' +
        '<div class="acct-sub"><span class="tag" style="background:' + t.s + ';color:' + t.c + '">' + t.label + '</span>' +
        '<span class="num">' + money(x.payment||0) + ' on the ' + ord(x.dueDay) + '</span>' +
        (t.amortize && x.apr ? '<span class="num"> · ' + x.apr + '%</span>' : '') + '</div>' +
        (x.limit ? '<div class="bar"><i class="' + (pct>50?'high':'') + '" style="width:' + pct + '%;background:' + (pct>50?'var(--rust)':t.c) + '"></i></div>' : '') +
        '<div class="row-acts">' +
        (x.url ? '<button class="chipbtn" data-act="open" data-id="' + x.id + '">Open payment page</button>' : '') +
        '<button class="chipbtn" data-act="edit" data-id="' + x.id + '">Edit</button>' +
        '<button class="chipbtn danger" data-act="del" data-id="' + x.id + '">Remove</button>' +
        '</div></div>';
    });
    html += '</div></div>';

    /* projection */
    var p = project();
    if (p.debts.length) {
      html += '<div class="sec"><div class="sec-head"><h2>Where this ends</h2></div><div class="card"><div class="proj-top">';
      if (p.months === null) {
        html += '<div class="proj-big">Not at these payments</div><div class="proj-sub">Interest is outrunning at least one payment.</div>';
      } else {
        var e = new Date(); e.setMonth(e.getMonth()+p.months);
        html += '<div class="proj-big">Clear by ' + MO[e.getMonth()] + ' ' + e.getFullYear() + '</div>' +
          '<div class="proj-sub">' + p.months + ' months away · ' + money(p.interest) + ' in interest to get there</div>';
      }
      html += '</div>';
      if (p.stalled.length) html += '<div class="flag">The payment on ' + esc(p.stalled.join(', ')) +
        ' does not cover its own monthly interest, so that balance grows no matter how long you keep paying.</div>';
      html += '<div class="chart">' + chart(p.series) + '</div>' +
        '<div class="ctrls"><div class="ctrl"><label for="extra">Extra toward debt each month</label>' +
        '<input class="inline num" id="extra" type="number" min="0" step="25" value="' + state.extra + '"></div>' +
        '<div class="seg"><button data-act="strat" data-v="avalanche" class="' + (state.strategy==='avalanche'?'on':'') + '">Highest rate</button>' +
        '<button data-act="strat" data-v="snowball" class="' + (state.strategy==='snowball'?'on':'') + '">Smallest balance</button></div>' +
        '<div class="seg-note">' + (state.strategy==='avalanche'
          ? 'The cheapest route. Every extra dollar hits your highest rate first.'
          : 'The most motivating route. Small accounts clear early, for slightly more interest.') +
        ' Either way, each cleared payment rolls into the next account.</div></div>';
      html += '<table class="tbl"><thead><tr><th>Account</th><th>Clear by</th><th>Interest</th></tr></thead><tbody>';
      p.debts.slice().sort(function(x,y){return (x.months||9999)-(y.months||9999);}).forEach(function (d) {
        var w;
        if (d.months === null) w = '<span class="never">never</span>';
        else { var dt = new Date(); dt.setMonth(dt.getMonth()+d.months); w = MO[dt.getMonth()]+' '+String(dt.getFullYear()).slice(2); }
        html += '<tr><td>' + esc(d.name) + '</td><td class="num">' + w + '</td><td class="num">' + money(d.interest) + '</td></tr>';
      });
      html += '</tbody></table></div></div>';
    }

    /* ways to save */
    var ops = opportunities();
    if (ops.length) {
      html += '<div class="sec"><div class="sec-head"><h2>Ways to save</h2><span class="note">by the dollar</span></div><div class="card">';
      ops.forEach(function (o) {
        html += '<div class="op"><div class="op-top"><span class="op-t">' + esc(o.title) + '</span>' +
          (o.save>0 ? '<span class="op-s num">' + money(o.save) + '</span>' : '') + '</div>' +
          '<div class="op-b">' + o.body + '</div>' + (o.act ? '<div class="op-a">' + o.act + '</div>' : '') + '</div>';
      });
      html += '</div>';

      var o = state.offer || { id:'', rate:'', fee:'', months:'' };
      html += '<div class="card"><div class="op"><div class="op-t">Check a real offer</div>' +
        '<div class="op-b">Got a quote or a transfer offer in the mail? Put its terms in and see what it is worth against what you pay now.</div></div>' +
        '<div style="padding:0 16px 4px">' +
        '<div class="field"><label for="o-acct">Account</label><select id="o-acct"><option value="">Choose one</option>' +
        a.filter(function(x){return TYPES[x.type].amortize && x.balance>0;}).map(function(x){
          return '<option value="'+x.id+'"'+(o.id===x.id?' selected':'')+'>'+esc(x.name)+' · '+x.apr+'%</option>';
        }).join('') + '</select></div>' +
        '<div class="pair"><div class="field"><label for="o-rate">New rate %</label>' +
        '<input id="o-rate" type="number" step="0.01" min="0" value="' + o.rate + '" placeholder="0"></div>' +
        '<div class="field"><label for="o-fee">Fee %</label>' +
        '<input id="o-fee" type="number" step="0.1" min="0" value="' + o.fee + '" placeholder="3"></div></div>' +
        '<div class="field"><label for="o-months">Intro months, if any</label>' +
        '<input id="o-months" type="number" step="1" min="0" value="' + o.months + '" placeholder="18">' +
        '<div class="hint">Leave blank for a permanent refinance.</div></div></div>';
      var r = offerResult();
      if (r) html += '<div class="verdict">' +
        '<div class="v-row"><span>As it stands</span><b class="num">' + money(r.nowInt) + '</b></div>' +
        '<div class="v-row"><span>Under this offer</span><b class="num">' + (r.newInt===null?'—':money(r.newInt)) + '</b></div>' +
        (r.fee>0 ? '<div class="v-row"><span>Fee</span><b class="num">' + money(r.fee) + '</b></div>' : '') +
        '<div class="v-row tot"><span>' + (r.net>=0?'You keep':'It costs you') + '</span><b class="num ' +
        (r.net>=0?'good':'bad') + '">' + money(Math.abs(r.net||0)) + '</b></div></div>';
      html += '</div></div>';
    }

    html += '<div class="fab-wrap"><button class="fab" data-act="add">Add an account</button></div>';
    html += dataSection();
    html += legal();

    if (editing !== null) html += sheet();
    root.innerHTML = html;
    wire();
  }

  /* ---------- sheet ---------- */
  function sheet() {
    var a = editing.id ? state.accounts.filter(function(x){return x.id===editing.id;})[0] : null;
    a = a || { name:'', type:'card', balance:'', limit:'', apr:'', payment:'', dueDay:1, autopay:false, url:'', remind:3 };
    var days = ''; for (var i=1;i<=31;i++) days += '<option value="'+i+'"'+(a.dueDay===i?' selected':'')+'>'+ord(i)+'</option>';
    var lead = a.remind === undefined ? 3 : a.remind;

    return '<div class="sheet" data-act="backdrop"><div class="sheet-in"><div class="grab"></div>' +
      '<h3>' + (editing.id ? 'Edit account' : 'New account') + '</h3>' +
      '<div class="field"><label for="f-name">What is it</label><input id="f-name" value="' + esc(a.name) + '" placeholder="Chase Sapphire"></div>' +
      '<div class="field"><label for="f-type">Type</label><select id="f-type">' +
      Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(a.type===k?' selected':'')+'>'+TYPES[k].label+'</option>';}).join('') +
      '</select></div>' +
      '<div class="pair"><div class="field"><label for="f-bal">Balance owed</label>' +
      '<input id="f-bal" type="number" step="0.01" min="0" value="' + a.balance + '"><div class="hint">Skip for utilities.</div></div>' +
      '<div class="field"><label for="f-apr">Rate %</label><input id="f-apr" type="number" step="0.01" min="0" value="' + a.apr + '"></div></div>' +
      '<div class="pair"><div class="field"><label for="f-pay">Monthly payment</label>' +
      '<input id="f-pay" type="number" step="0.01" min="0" value="' + a.payment + '"></div>' +
      '<div class="field"><label for="f-due">Due on the</label><select id="f-due">' + days + '</select></div></div>' +
      '<div class="field"><label for="f-lead">Remind me</label><select id="f-lead">' +
      '<option value="-1"' + (lead===-1?' selected':'') + '>Never</option>' +
      LEADS.map(function(n){return '<option value="'+n+'"'+(lead===n?' selected':'')+'>'+leadLabel(n)+'</option>';}).join('') +
      '</select></div>' +
      '<div class="field"><label for="f-url">Payment page</label>' +
      '<input id="f-url" type="url" value="' + esc(a.url||'') + '" placeholder="https://…">' +
      '<div class="hint">A link to where you pay it. Paste the address of your provider\'s login page — never a password.</div></div>' +
      '<div class="field"><label for="f-limit">Credit limit</label>' +
      '<input id="f-limit" type="number" step="1" min="0" value="' + (a.limit||'') + '"><div class="hint">Cards only.</div></div>' +
      '<div class="field"><label><input type="checkbox" id="f-auto" style="width:auto;margin-right:8px"' + (a.autopay?' checked':'') + '>This one is on autopay</label></div>' +
      '<div class="s-acts"><button data-act="cancel">Cancel</button><button class="save" data-act="save">Save</button></div>' +
      '</div></div>';
  }

  function readSheet() {
    var g = function(i){ return document.getElementById(i); };
    var name = g('f-name').value.trim();
    if (!name) { g('f-name').focus(); return null; }
    var url = g('f-url').value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    return {
      id: editing.id || 'a' + Date.now(),
      name: name, type: g('f-type').value,
      balance: parseFloat(g('f-bal').value)||0,
      apr: parseFloat(g('f-apr').value)||0,
      payment: parseFloat(g('f-pay').value)||0,
      dueDay: parseInt(g('f-due').value,10)||1,
      limit: parseFloat(g('f-limit').value)||0,
      remind: parseInt(g('f-lead').value,10),
      url: url, autopay: g('f-auto').checked
    };
  }

  /* ---------- events ---------- */
  function wire() {
    root.querySelectorAll('[data-act]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
        if (['ics', 'notify', 'export'].indexOf(act) === -1) flash = null;

        if (act === 'add') { OT.tap('Light'); editing = {}; render(); }
        else if (act === 'edit') { editing = { id:id }; render(); }
        else if (act === 'cancel') { editing = null; render(); }
        else if (act === 'backdrop') { if (e.target === el) { editing = null; render(); } }
        else if (act === 'save') {
          var rec = readSheet(); if (!rec) return;
          var i = state.accounts.findIndex(function(x){return x.id===rec.id;});
          if (i>-1) state.accounts[i] = rec; else state.accounts.push(rec);
          editing = null; save(); render();
        }
        else if (act === 'del') { state.accounts = state.accounts.filter(function(x){return x.id!==id;}); save(); render(); }
        else if (act === 'paid') {
          OT.tap('Medium');
          var ck = ckey(today()), arr = state.paid[ck]||[];
          state.paid[ck] = arr.indexOf(id)>-1 ? arr.filter(function(x){return x!==id;}) : arr.concat([id]);
          save(); render();
        }
        else if (act === 'strat') { state.strategy = el.getAttribute('data-v'); save(); render(); }
        else if (act === 'ics') { downloadICS(); }
        else if (act === 'export') { doExport(); }
        else if (act === 'import-open') { dataPanel = 'import'; pendingImport = null; render(); }
        else if (act === 'import-cancel') { dataPanel = null; pendingImport = null; render(); }
        else if (act === 'import-apply') { applyImport(); }
        else if (act === 'notify') { askNotify(); }
        else if (act === 'open') {
          var acc = state.accounts.filter(function(x){return x.id===id;})[0];
          if (acc && acc.url) window.open(acc.url, '_blank', 'noopener,noreferrer');
        }
      });
    });

    var ex = document.getElementById('extra');
    if (ex) ex.addEventListener('change', function () {
      state.extra = Math.max(0, parseFloat(ex.value)||0); save(); render();
    });

    var impFile = document.getElementById('imp-file');
    if (impFile) impFile.addEventListener('change', function () {
      var f = impFile.files && impFile.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { pendingImport = parseImport(String(r.result)); render(); };
      r.onerror = function () { pendingImport = { error: 'That file could not be read.' }; render(); };
      r.readAsText(f);
    });

    var impText = document.getElementById('imp-text');
    if (impText) impText.addEventListener('change', function () {
      var v = impText.value.trim();
      pendingImport = v ? parseImport(v) : null;
      render();
    });

    var rh = document.getElementById('r-hour');
    if (rh) rh.addEventListener('change', function () {
      state.remindHour = parseInt(rh.value,10); save(); render();
    });

    root.querySelectorAll('select.lead').forEach(function (s) {
      s.addEventListener('change', function () {
        var id = s.getAttribute('data-id');
        var acc = state.accounts.filter(function(x){return x.id===id;})[0];
        if (acc) { acc.remind = parseInt(s.value,10); save(); render(); }
      });
    });

    ['o-acct','o-rate','o-fee','o-months'].forEach(function (id) {
      var el = document.getElementById(id); if (!el) return;
      el.addEventListener('change', function () {
        state.offer = {
          id: document.getElementById('o-acct').value,
          rate: document.getElementById('o-rate').value,
          fee: document.getElementById('o-fee').value,
          months: document.getElementById('o-months').value
        };
        save(); render();
      });
    });
  }

  async function boot() {
    await load();
    OT.styleStatusBar();

    if (OT.isNative() && state.lock && await OT.lockAvailable()) {
      var screen = document.getElementById('lockscreen');
      screen.classList.add('on');
      var tryUnlock = async function () {
        if (await OT.unlock()) { screen.classList.remove('on'); }
      };
      document.getElementById('unlock').addEventListener('click', tryUnlock);
      await tryUnlock();
    }

    render();
    bindNotificationActions();
    syncNative();
    if (!OT.isNative()) { checkNudges(); setInterval(checkNudges, 300000); }
  }
  boot().catch(function () { render(); });
})();
</script>
</body></html>
